name: 'Redazione PA · ricerca e proposta'
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'DEMO (senza IA) oppure LIVE (con Groq)'
        required: true
        type: choice
        options:
          - demo
          - live
        default: demo
      rss_url:
        description: 'RSS da usare per LIVE (lascia vuoto per config.json)'
        type: string
        required: false
        default: ''
  schedule:
    - cron: '20 8 * * 1-5'  # opzionale: non elabora se scheduler_enabled=false
permissions:
  contents: read
  issues: write
concurrency:
  group: redazionepa-ricerca
  cancel-in-progress: false
jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: 'Raccogli, pianifica, approfondisci; CREA BOZZA (mai pubblicazione)'
        run: python scripts/research.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MODE: ${{ github.event.inputs.mode || 'live' }}
          RSS_OVERRIDE: ${{ github.event.inputs.rss_url || '' }}
